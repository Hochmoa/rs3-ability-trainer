name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Stamp the build (footer shows commit + time)
        run: printf "export const BUILD = '%s %s';
" "${GITHUB_SHA::7}" "$(date -u +%Y-%m-%d\ %H:%M)" > src/app/version.ts
      - run: npm run build
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist/rs3-ability-trainer/browser

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
