name: Keep Supabase awake

# Free-tier projects pause after a week without API activity; one read every 3 days is enough.
on:
  schedule:
    - cron: '17 4 */3 * *'
  workflow_dispatch:

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Read one public rotation with the publishable key
        run: |
          curl -sf "https://lqimsvrbpfabkyaupcgx.supabase.co/rest/v1/public_rotations?select=id&limit=1" \
            -H "apikey: sb_publishable_3wAvSm8Yzo4xyz2WVQSkrw_4H_tMti8" \
            -H "Authorization: Bearer sb_publishable_3wAvSm8Yzo4xyz2WVQSkrw_4H_tMti8"
