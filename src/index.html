  <script type="application/ld+json" id="ld-json">{}</script>
  <!-- with JavaScript the loading indicator is what a visitor sees; the static text of the built pages is for crawlers
       without it (tools/seo-content.mjs). Set before the body renders, so neither of the two ever flashes. -->
  <script>document.documentElement.className += ' js';</script>
  <!-- first paint on slow phones: the app's dark background and text colour before the stylesheet arrives -->
  <style>
    body{margin:0;background:#0f0f12;color:#e8e4d8;font-family:'Segoe UI',system-ui,-apple-system,Roboto,sans-serif}
    .boot{display:none}
    .js .boot{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:16px;min-height:65vh;padding:16px}
    .js .seo-static{display:none}
    /* the cooldown sweep of the ability icons, one turn per global cooldown */
    .boot-sweep{width:54px;height:54px;border-radius:50%;background:conic-gradient(#c9a227 0deg,rgba(201,162,39,.10) 110deg,rgba(201,162,39,.10) 360deg);-webkit-mask:radial-gradient(circle,#0000 57%,#000 59%);mask:radial-gradient(circle,#0000 57%,#000 59%);animation:boot-sweep 1.8s linear infinite}
    @keyframes boot-sweep{to{transform:rotate(360deg)}}
    @media (prefers-reduced-motion:reduce){.boot-sweep{animation-duration:7.2s}}
    .boot-error .boot-sweep{display:none}
    #boot-msg{margin:0;color:#9a968c;text-align:center;max-width:34em}
  </style>
</head>
<body>
  <app-root><!-- crawlable static content per route is injected here by tools/postbuild.mjs, in front of this indicator --><div class="boot" role="status"><div class="boot-sweep" aria-hidden="true"></div><p id="boot-msg">Loading RS3 Ability Trainer…</p></div></app-root>
  <noscript><p style="padding:16px;color:#ffb300">This trainer needs JavaScript – please enable it for this site.</p></noscript>
  <!-- the bundle targets ES2022 (Chrome 94+, Safari 15.4+, Firefox 93+, the Chromium in Alt1): an older browser would parse-fail
       silently and stay on "Loading…" – say so instead. structuredClone / Array.prototype.at arrived with that generation. -->
  <script>
    (function () {
      var ok = typeof structuredClone === 'function' && typeof Array.prototype.at === 'function' && typeof Object.hasOwn === 'function';
      if (ok) return;
      var msg = 'This browser is too old for the trainer – it needs Chrome / Edge 94+, Firefox 93+ or Safari 15.4+ (Alt1: update the toolkit).';
      document.documentElement.className += ' boot-error'; // the sweep would spin under the message forever
      var p = document.getElementById('boot-msg');
      var root = document.querySelector('app-root'); // the built pages carry static content instead of the loading line (tools/postbuild.mjs)
      if (p) p.textContent = msg;
      else if (root) root.insertAdjacentHTML('afterbegin', '<p style="padding:16px;color:#ffb300">' + msg + '</p>');
    })();
  </script>
</body>
